name: major-upgrade-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      # Required by Settings(); tests use SQLite and do not need real services.
      # JWT_SECRET is generated in a step so gitleaks does not flag a committed value.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-password
      MINIO_ACCESS_KEY: test-access-key
      MINIO_SECRET_KEY: test-secret-key
      REDIS_PASSWORD: test-redis-password
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-neo4j-password
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      - run: uv run ruff check app tests alembic
        working-directory: backend
      - run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -r app -ll
        working-directory: backend
      - run: uv run pytest -q --tb=short
        working-directory: backend
      # Audit the synced env. Do not reinstall from a requirements export:
      # FlexSearch pins torch==…+cpu (PyTorch index), which plain pip-audit -r cannot resolve.
      - run: uv run --with pip-audit pip-audit
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: cp .env.example .env
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm audit --prod --audit-level high
        working-directory: frontend

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: flexsearch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: flexsearch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flexsearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      # Prefer 127.0.0.1 — localhost can resolve to ::1 on some runners.
      POSTGRES_URL: postgresql+asyncpg://flexsearch:ci-only-password@127.0.0.1:5432/flexsearch
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: flexsearch
      POSTGRES_PASSWORD: ci-only-password
      MINIO_ACCESS_KEY: test-access-key
      MINIO_SECRET_KEY: test-secret-key
      REDIS_PASSWORD: test-redis-password
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-neo4j-password
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - name: Assert alembic_version matches head
        working-directory: backend
        run: |
          expected="$(uv run alembic heads | awk '{print $1}')"
          actual="$(uv run alembic current | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
      - run: uv run alembic check
        working-directory: backend

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t flexsearch-api:ci backend
      - run: docker build -t flexsearch-worker:ci -f backend/Dockerfile.worker backend
      - run: docker build -t flexsearch-frontend:ci frontend
      # Report-only: ML/slim base images surface HIGH/CRITICAL CVEs that block the gate
      # without reflecting app regressions. infra-hub omits Trivy; we keep scans visible.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flexsearch-api:ci
          version: v0.72.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flexsearch-worker:ci
          version: v0.72.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flexsearch-frontend:ci
          version: v0.72.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Assert local secrets and development artifacts are absent
        run: |
          # Only check app-owned paths. Do not search .venv — third-party packages
          # ship directories named "tests" (networkx, sympy, …) which are not our suite.
          assert_clean() {
            docker run --rm "$1" sh -c '
              set -e
              for p in /app/.env /app/.git /app/tests; do
                if [ -e "$p" ]; then echo "unexpected: $p"; exit 1; fi
              done
              found="$(find /app \( -path /app/.venv -o -path /app/.venv/\* \) -prune -o \
                \( -name ".env.*" -o -name "*.db" -o -name "*.log" \) -print)"
              if [ -n "$found" ]; then echo "$found"; exit 1; fi
            '
          }
          assert_clean flexsearch-api:ci
          assert_clean flexsearch-worker:ci
