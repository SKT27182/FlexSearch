[project]
name = "flexsearch-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "litellm>=1.81.5",
    "minio>=7.2.20",
    "neo4j>=5.11.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==3.2.2",
    "pdf2image>=1.17.0",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.6.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "opensearch-py>=2.8.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.1",
    "sentence-transformers>=5.2.2",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.40.0",
    "graphrag>=3.1.0,<4",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "jinja2>=3.1.6",
    "ftfy>=6.3.0",
    "scikit-learn>=1.5.0",
    "docling>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-experimental>=0.3.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "aiosqlite>=0.19.0",
    "ruff>=0.14.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
